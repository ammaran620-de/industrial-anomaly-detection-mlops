services:
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      MODEL_PATH: artifacts/patchcore_carpet.pt
      THRESHOLD: "3.0"
    volumes:
      - ./artifacts:/app/artifacts:ro

  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.9.2
    ports:
      - "5000:5000"
    volumes:
      - ./mlruns:/mlruns
    command: mlflow server --host 0.0.0.0 --port 5000 --backend-store-uri file:///mlruns
